<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Bharat Network Group</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1 fw-bold text-danger">Bharat Network Admin Console</span>
      <a href="index.html" class="btn btn-outline-light btn-sm" target="_blank">View Public Portal <i class="bi bi-box-arrow-up-right ms-1"></i></a>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row g-4">
      
      <!-- Event Form -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h5 class="fw-bold mb-3" id="formTitle">Add New Event</h5>
            <form id="eventForm">
              <input type="hidden" id="eventId">

              <div class="mb-2">
                <label class="form-label small fw-bold">Title</label>
                <input type="text" class="form-control form-control-sm" id="title" required>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-6">
                  <label class="form-label small fw-bold">Category</label>
                  <select class="form-select form-select-sm" id="category">
                    <option value="NBFC">NBFC</option>
                    <option value="Education">Education</option>
                    <option value="Tech">Tech</option>
                    <option value="BFSI">BFSI</option>
                    <option value="Banking">Banking</option>
                    <option value="Enterprise">Enterprise</option>
                    <option value="Pharma">Pharma</option>
                    <option value="Marketing">Marketing</option>
                  </select>
                </div>
                <div class="col-6">
                  <label class="form-label small fw-bold">Status</label>
                  <select class="form-select form-select-sm" id="status">
                    <option value="Upcoming">Upcoming</option>
                    <option value="Past">Past</option>
                  </select>
                </div>
              </div>

              <div class="mb-2">
                <label class="form-label small fw-bold">Format</label>
                <select class="form-select form-select-sm" id="format">
                  <option value="In-person Event">In-person Event</option>
                  <option value="Residential Event">Residential Event</option>
                  <option value="Round Table">Round Table</option>
                  <option value="Custom Event">Custom Event</option>
                  <option value="Panel Discussion">Panel Discussion</option>
                  <option value="Webinar">Webinar</option>
                  <option value="Case Study">Case Study</option>
                  <option value="Virtual Event">Virtual Event</option>
                </select>
              </div>

              <div class="mb-2">
                <label class="form-label small fw-bold">Date</label>
                <input type="text" class="form-control form-control-sm" id="date" placeholder="e.g. Nov 12, 2026" required>
              </div>

              <div class="mb-2">
                <label class="form-label small fw-bold">Location</label>
                <input type="text" class="form-control form-control-sm" id="location" required>
              </div>

              <div class="mb-2">
                <label class="form-label small fw-bold">Website URL</label>
                <input type="url" class="form-control form-control-sm" id="websiteUrl" required>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold">Image</label>
                <input type="file" class="form-control form-control-sm" id="featureImage" accept="image/*">
              </div>

              <button type="submit" class="btn btn-danger btn-sm w-100 fw-bold" id="submitBtn">Create Event</button>
              <button type="button" class="btn btn-light btn-sm w-100 mt-2 d-none" id="cancelEditBtn" onclick="resetForm()">Cancel Edit</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Events List Table -->
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h5 class="fw-bold mb-3">Managed Events</h5>
            <div class="table-responsive">
              <table class="table table-hover align-middle small">
                <thead class="table-light">
                  <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Format</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api/events';
    let events = [];

    document.addEventListener("DOMContentLoaded", fetchEvents);

    async function fetchEvents() {
      try {
        const res = await fetch(API_BASE);
        events = await res.json();
        renderTable();
      } catch (err) {
        console.error("Error fetching events:", err);
      }
    }

    function renderTable() {
      const tbody = document.getElementById("adminTableBody");
      tbody.innerHTML = events.map(e => `
        <tr>
          <td class="fw-bold">${e.title}</td>
          <td><span class="badge bg-danger">${e.category}</span></td>
          <td>${e.format || 'In-person Event'}</td>
          <td><span class="badge bg-secondary">${e.status || 'Upcoming'}</span></td>
          <td class="text-end">
            <button class="btn btn-outline-secondary btn-sm me-1" onclick="editEvent('${e._id}')"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-outline-danger btn-sm" onclick="deleteEvent('${e._id}')"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById("eventForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const id = document.getElementById("eventId").value;
      const imageFile = document.getElementById('featureImage').files[0];

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('category', document.getElementById('category').value);
      formData.append('status', document.getElementById('status').value);
      formData.append('format', document.getElementById('format').value);
      formData.append('date', document.getElementById('date').value);
      formData.append('location', document.getElementById('location').value);
      formData.append('websiteUrl', document.getElementById('websiteUrl').value);

      if (imageFile) {
        formData.append('featureImage', imageFile);
      }

      const url = id ? `${API_BASE}/${id}` : API_BASE;
      const method = id ? 'PUT' : 'POST';

      try {
        const response = await fetch(url, {
          method: method,
          body: formData
        });

        if (response.ok) {
          resetForm();
          fetchEvents();
        } else {
          const errData = await response.json();
          alert(`Failed to save: ${errData.error || 'Server error'}`);
        }
      } catch (err) {
        console.error("Submission Error Details:", err);
        alert("Connection error: Unable to reach http://localhost:5000. Ensure node server.js is actively running in your command prompt.");
      }
    });

    function editEvent(id) {
      const event = events.find(e => e._id === id);
      if (!event) return;

      document.getElementById("eventId").value = event._id;
      document.getElementById("title").value = event.title;
      document.getElementById("category").value = event.category;
      document.getElementById("status").value = event.status || 'Upcoming';
      document.getElementById("format").value = event.format || 'In-person Event';
      document.getElementById("date").value = event.date;
      document.getElementById("location").value = event.location;
      document.getElementById("websiteUrl").value = event.websiteUrl;

      document.getElementById("formTitle").textContent = "Edit Event";
      document.getElementById("submitBtn").textContent = "Update Event";
      document.getElementById("cancelEditBtn").classList.remove("d-none");
      document.getElementById("featureImage").value = "";
    }

    function resetForm() {
      document.getElementById("eventForm").reset();
      document.getElementById("eventId").value = "";
      document.getElementById("formTitle").textContent = "Add New Event";
      document.getElementById("submitBtn").textContent = "Create Event";
      document.getElementById("cancelEditBtn").classList.add("d-none");
    }

    async function deleteEvent(id) {
      if (confirm("Delete this event permanently?")) {
        try {
          const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
          if (res.ok) fetchEvents();
        } catch (err) {
          console.error("Delete Error:", err);
          alert("Could not delete event. Check server connection.");
        }
      }
    }
  </script>
</body>
</html>
